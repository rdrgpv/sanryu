# Roda os testes do backend e o build do frontend a cada push na main e em todo pull request
# (inclusive os do Dependabot), pra saber se uma atualização quebrou algo antes de aprovar.
# Também roda o npm audit: falha se aparecer vulnerabilidade alta ou crítica.
name: Testes

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Vulnerabilidades (alta ou crítica)
        run: npm audit --omit=dev --audit-level=high

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Vulnerabilidades (alta ou crítica)
        run: npm audit --omit=dev --audit-level=high
